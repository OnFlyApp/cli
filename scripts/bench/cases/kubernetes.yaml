cases:
  - query: pick a node for a pod that has not been placed yet
    expect: [{file: pkg/scheduler/schedule_one.go}]
  - query: the loop that brings the containers of a pod on a machine to the desired state
    expect: [{file: pkg/kubelet/kubelet.go}]
  - query: chain of checks run on a request before it is stored
    expect: [{file: staging/src/k8s.io/apiserver/pkg/admission/chain.go}]
  - query: decide which workloads to kill when a machine runs low on memory
    expect: [{file: pkg/kubelet/eviction/eviction_manager.go}]
  - query: keep the number of running copies equal to the wanted count
    expect: [{file: pkg/controller/replicaset/replica_set.go}]
  - query: identify the caller from a token sent in the request header
    expect: [{file: staging/src/k8s.io/apiserver/pkg/authentication/request/bearertoken/bearertoken.go}]
  - query: replace old versions of an app gradually while keeping it available
    expect: [{file: pkg/controller/deployment/rolling.go}]
  - query: hand out virtual addresses to services from a range
    expect: [{file: pkg/registry/core/service/ipallocator/ipallocator.go}]
  - query: clean up objects that belonged to something that was removed
    expect: [{file: pkg/controller/garbagecollector/garbagecollector.go}]
  - query: cap how much of the cluster a namespace may consume
    expect: [{file: pkg/controller/resourcequota/resource_quota_controller.go}]
  - query: notice that a machine stopped reporting and mark it unhealthy
    expect: [{file: pkg/controller/nodelifecycle/node_lifecycle_controller.go}]
