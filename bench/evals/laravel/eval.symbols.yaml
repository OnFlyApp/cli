cases:
  - query: match an incoming request against the registered routes
    expect: [{file: src/Illuminate/Routing/RouteCollection.php|src/Illuminate/Routing/AbstractRouteCollection.php|src/Illuminate/Routing/CompiledRouteCollection.php|src/Illuminate/Routing/Router.php}]
  - query: resolve a class and its constructor dependencies automatically
    expect: [{file: src/Illuminate/Container/Container.php}]
  - query: run layers of code around a request one after another
    expect: [{file: src/Illuminate/Pipeline/Pipeline.php}]
  - query: load related records in one query to avoid repeated lookups
    expect: [{file: src/Illuminate/Database/Eloquent/Builder.php|src/Illuminate/Database/Eloquent/Relations/Relation.php}]
  - query: turn a column definition into the statement that creates a table
    expect: [{file: src/Illuminate/Database/Schema/Grammars/Grammar.php|src/Illuminate/Database/Schema/Blueprint.php}]
  - query: pause and try again with a delay when a background task fails
    expect: [{file: src/Illuminate/Queue/Worker.php|src/Illuminate/Queue/Jobs/Job.php}]
  - query: scramble and unscramble strings with the application secret
    expect: [{file: src/Illuminate/Encryption/Encrypter.php}]
  - query: limit how many requests a client can make per minute
    expect: [{file: src/Illuminate/Cache/RateLimiter.php|src/Illuminate/Routing/Middleware/ThrottleRequests.php}]
  - query: turn a template with echoes and directives into executable code
    expect: [{file: src/Illuminate/View/Compilers/BladeCompiler.php}]
  - query: decide whether a user is permitted to perform an action
    expect: [{file: src/Illuminate/Auth/Access/Gate.php}]
  - query: deliver a message with an attachment to a recipient
    expect: [{file: src/Illuminate/Mail/Mailer.php|src/Illuminate/Mail/Message.php}]
  - query: react in one place to something that happened elsewhere in the app
    expect: [{file: src/Illuminate/Events/Dispatcher.php}]
  - query: keep uploaded files on a local disk or a cloud bucket
    expect: [{file: src/Illuminate/Filesystem/FilesystemManager.php|src/Illuminate/Filesystem/Filesystem.php}]
  - query: check submitted form data against a set of constraints
    expect: [{file: src/Illuminate/Validation/Validator.php}]
  - query: write an entry to the application journal at a given severity
    expect: [{file: src/Illuminate/Log/LogManager.php|src/Illuminate/Log/Logger.php}]
